<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuaca & Peta Interaktif</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS (Peta) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- FontAwesome (Ikon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: white;
        }

        /* Glassmorphism Effect */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1); 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3); 
            border-radius: 4px;
        }

        #map {
            z-index: 1; /* Ensure map stays below fixed headers if any */
        }
        
        /* Animation */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center">

    <div class="container mx-auto max-w-6xl">
        
        <!-- Header & Search -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <h1 class="text-3xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-cloud-bolt text-yellow-400"></i> SkyCast
            </h1>
            
            <div class="relative w-full md:w-96">
                <input type="text" id="searchInput" placeholder="Cari kota (contoh: Jakarta)..." 
                    class="w-full py-3 px-5 rounded-full bg-white/20 border border-white/30 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-yellow-400 shadow-lg">
                <button onclick="handleSearch()" class="absolute right-2 top-1.5 bg-yellow-400 hover:bg-yellow-500 text-blue-900 rounded-full p-2 w-10 h-10 flex items-center justify-center transition">
                    <i class="fa-solid fa-search"></i>
                </button>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 fade-in">
            
            <!-- Left Column: Current Weather -->
            <div class="glass p-6 flex flex-col justify-between h-full relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-40 h-40 bg-yellow-400 rounded-full blur-3xl opacity-20"></div>
                
                <div>
                    <h2 id="cityName" class="text-2xl font-semibold mb-1">Jakarta</h2>
                    <p id="currentDate" class="text-sm text-gray-200">Selasa, 25 Nov 2025</p>
                </div>

                <div class="flex flex-col items-center my-8">
                    <i id="weatherIcon" class="fa-solid fa-cloud-sun text-8xl mb-4 text-yellow-300 drop-shadow-lg"></i>
                    <h1 id="tempDisplay" class="text-6xl font-bold">30°C</h1>
                    <p id="weatherDesc" class="text-xl font-medium mt-2">Cerah Berawan</p>
                </div>

                <div class="grid grid-cols-2 gap-4 mt-auto">
                    <div class="bg-white/10 p-3 rounded-lg text-center">
                        <i class="fa-solid fa-wind mb-1 text-gray-300"></i>
                        <p class="text-xs text-gray-300">Angin</p>
                        <p id="windSpeed" class="font-bold">10 km/h</p>
                    </div>
                    <div class="bg-white/10 p-3 rounded-lg text-center">
                        <i class="fa-solid fa-droplet mb-1 text-blue-300"></i>
                        <p class="text-xs text-gray-300">Kelembaban</p>
                        <p id="humidity" class="font-bold">65%</p>
                    </div>
                </div>
            </div>

            <!-- Middle Column: Map -->
            <div class="glass p-2 h-[400px] lg:h-auto lg:col-span-2 flex flex-col relative">
                <div id="map" class="w-full h-full rounded-xl shadow-inner border border-white/10"></div>
                <div class="absolute bottom-4 left-4 bg-black/60 backdrop-blur px-3 py-1 rounded text-xs z-[1000] pointer-events-none">
                    <i class="fa-solid fa-mouse-pointer"></i> Klik peta untuk cek cuaca lokasi lain
                </div>
            </div>

        </div>

        <!-- Bottom: Weekly Forecast (Simple) -->
        <div class="mt-6 glass p-6">
            <h3 class="text-lg font-semibold mb-4 border-b border-white/20 pb-2">Prakiraan 3 Hari Ke Depan</h3>
            <div id="forecastContainer" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Forecast Items will be injected here -->
                <div class="text-center p-4 bg-white/5 rounded-lg animate-pulse">
                    Loading data...
                </div>
            </div>
        </div>
        
        <footer class="text-center mt-8 text-gray-400 text-sm">
            &copy; 2025 SkyCast Dashboard. Data by Open-Meteo.
        </footer>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // --- Inisialisasi Peta ---
        const map = L.map('map').setView([-6.2088, 106.8456], 10); // Default Jakarta

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        let marker = L.marker([-6.2088, 106.8456]).addTo(map);

        // --- Helper: Konversi Kode WMO ke Ikon & Deskripsi ---
        function getWeatherDetails(code) {
            // WMO Weather interpretation codes (WW)
            const codes = {
                0: { desc: "Cerah Langit Biru", icon: "fa-sun", color: "text-yellow-400" },
                1: { desc: "Cerah Utama", icon: "fa-cloud-sun", color: "text-yellow-300" },
                2: { desc: "Berawan Sebagian", icon: "fa-cloud", color: "text-gray-200" },
                3: { desc: "Mendung", icon: "fa-cloud", color: "text-gray-400" },
                45: { desc: "Kabut", icon: "fa-smog", color: "text-gray-300" },
                48: { desc: "Kabut Rime", icon: "fa-smog", color: "text-gray-300" },
                51: { desc: "Gerimis Ringan", icon: "fa-cloud-rain", color: "text-blue-300" },
                53: { desc: "Gerimis Sedang", icon: "fa-cloud-rain", color: "text-blue-300" },
                55: { desc: "Gerimis Lebat", icon: "fa-cloud-showers-heavy", color: "text-blue-400" },
                61: { desc: "Hujan Ringan", icon: "fa-cloud-rain", color: "text-blue-400" },
                63: { desc: "Hujan Sedang", icon: "fa-cloud-showers-heavy", color: "text-blue-500" },
                65: { desc: "Hujan Lebat", icon: "fa-cloud-showers-water", color: "text-blue-600" },
                80: { desc: "Hujan Lokal", icon: "fa-cloud-sun-rain", color: "text-blue-400" },
                95: { desc: "Badai Petir", icon: "fa-bolt", color: "text-yellow-500" },
                96: { desc: "Badai Petir & Hujan Es", icon: "fa-poo-storm", color: "text-purple-400" }
            };
            return codes[code] || { desc: "Tidak Diketahui", icon: "fa-question", color: "text-white" };
        }

        // --- Fungsi Utama Fetch Data Cuaca ---
        async function fetchWeather(lat, lon, cityName = "Lokasi Terpilih") {
            try {
                // 1. Update Map
                map.setView([lat, lon], 13);
                marker.setLatLng([lat, lon]);

                // 2. Fetch API Open-Meteo
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
                
                const response = await fetch(url);
                const data = await response.json();

                // 3. Update UI Saat Ini
                const current = data.current;
                const daily = data.daily;
                const weatherInfo = getWeatherDetails(current.weather_code);

                document.getElementById('cityName').innerText = cityName;
                document.getElementById('tempDisplay').innerText = `${Math.round(current.temperature_2m)}°C`;
                document.getElementById('weatherDesc').innerText = weatherInfo.desc;
                document.getElementById('windSpeed').innerText = `${current.wind_speed_10m} km/h`;
                document.getElementById('humidity').innerText = `${current.relative_humidity_2m}%`;
                
                // Update Icon Class
                const iconEl = document.getElementById('weatherIcon');
                iconEl.className = `fa-solid ${weatherInfo.icon} text-8xl mb-4 ${weatherInfo.color} drop-shadow-lg`;

                // Update Tanggal
                const dateOptions = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
                document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', dateOptions);

                // 4. Update UI Forecast (3 Hari)
                const forecastContainer = document.getElementById('forecastContainer');
                forecastContainer.innerHTML = ''; // Clear lama

                for(let i = 1; i <= 3; i++) {
                    const fCode = daily.weather_code[i];
                    const fMax = Math.round(daily.temperature_2m_max[i]);
                    const fMin = Math.round(daily.temperature_2m_min[i]);
                    const fInfo = getWeatherDetails(fCode);
                    const fDate = new Date(daily.time[i]).toLocaleDateString('id-ID', { weekday: 'long' });

                    const div = document.createElement('div');
                    div.className = "glass p-4 text-center hover:bg-white/10 transition";
                    div.innerHTML = `
                        <p class="text-sm font-semibold mb-2">${fDate}</p>
                        <i class="fa-solid ${fInfo.icon} text-3xl mb-2 ${fInfo.color}"></i>
                        <p class="text-xs text-gray-300 mb-1">${fInfo.desc}</p>
                        <p class="font-bold">${fMax}°C <span class="text-xs text-gray-400 font-normal">/ ${fMin}°C</span></p>
                    `;
                    forecastContainer.appendChild(div);
                }

            } catch (error) {
                console.error("Error fetching weather:", error);
                alert("Gagal mengambil data cuaca.");
            }
        }

        // --- Fungsi Cari Kota (Geocoding) ---
        async function handleSearch() {
            const query = document.getElementById('searchInput').value;
            if(!query) return;

            // Efek Loading sederhana pada tombol
            const btn = document.querySelector('button');
            const originalIcon = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${query}&count=1&language=id&format=json`;
                const res = await fetch(geoUrl);
                const data = await res.json();

                if(data.results && data.results.length > 0) {
                    const result = data.results[0];
                    const cityLabel = `${result.name}, ${result.country || ''}`;
                    await fetchWeather(result.latitude, result.longitude, cityLabel);
                } else {
                    alert("Kota tidak ditemukan!");
                }
            } catch (err) {
                alert("Terjadi kesalahan saat mencari kota.");
            } finally {
                btn.innerHTML = originalIcon;
            }
        }

        // --- Event Listener: Enter di Search Bar ---
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });

        // --- Event Listener: Klik di Peta ---
        map.on('click', function(e) {
            const { lat, lng } = e.latlng;
            // Kita gunakan koordinat presisi, nama kota diset generic karena butuh Reverse Geocoding yang kompleks untuk nama akurat tanpa API Key
            fetchWeather(lat, lng, `Lokasi: ${lat.toFixed(2)}, ${lng.toFixed(2)}`);
        });

        // --- Load Default (Jakarta) Saat Pertama Buka ---
        fetchWeather(-6.2088, 106.8456, "Jakarta");

    </script>
</body>
</html>
